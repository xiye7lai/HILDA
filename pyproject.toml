[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hilda-lifecycle"
version = "0.1.0"
description = "Minimal PyTorch implementation of HILDA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
